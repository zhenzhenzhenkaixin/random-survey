<script>
var urls = [
"https://v.wjx.cn/vm/QmTdhug.aspx",

"https://v.wjx.cn/vm/wLDt1BD.aspx",

];
function go(i){ window.location.replace(urls[i]); }
var done = false;
var timer = setTimeout(function(){ if(!done){ done = true; go(Math.floor(Math.random()*4)); } }, 3000);
fetch("https://abacus.jasoncameron.dev/hit/zhenzhenzhenkaixin.github.io/retest-assign")
.then(function(r){ return r.json(); })
.then(function(d){
if(done) return; done = true; clearTimeout(timer);

})
.catch(function(){ if(!done){ done = true; clearTimeout(timer); go(Math.floor(Math.random()*4)); } });
